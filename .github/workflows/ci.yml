name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets, no evals: evals call a paid API and run locally via `pnpm eval` (ADR 0007).
# The build must succeed without any environment variables.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Separate job so it can be marked as a required status check on its own: an article that
  # breaks the content rules (schema, EN/ES parity, length, banned patterns) can't be merged.
  kb-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:kb
